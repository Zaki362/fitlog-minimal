<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#B8FF3C" />
    <title>离线中 / 练一下</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f2;
        color: #141414;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 360px);
        display: grid;
        gap: 14px;
        text-align: center;
      }

      .mark {
        width: 68px;
        height: 68px;
        margin: 0 auto;
        border-radius: 18px;
        background: #b8ff3c;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: 26px;
      }

      p {
        margin: 0;
        color: #5f625a;
        line-height: 1.7;
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: #141414;
        color: #fff;
        font: inherit;
        font-weight: 850;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">练</div>
      <h1>暂时离线</h1>
      <p>已缓存的页面和训练数据仍会留在本机。网络恢复后，重新打开即可继续同步。</p>
      <button type="button" onclick="location.reload()">重新尝试</button>
    </main>
  </body>
</html>
